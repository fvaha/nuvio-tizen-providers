name: Build providers bundle

# Daily transpile of every scraper provider to a Chromium-47 target so Tizen / legacy
# webOS TVs (which cannot transpile on-device) can fetch a ready-to-run bundle.
# Edit plugin-repos.json to add/remove a repo — the bundle rebuilds automatically.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "plugin-repos.json"
      - "build.mjs"
  schedule:
    # Daily at 04:00 UTC — picks up upstream provider updates.
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-providers
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Babel
        run: npm install

      - name: Transpile providers (chrome 47)
        run: npm run build

      - name: Commit refreshed bundle
        run: |
          if git diff --quiet -- providers.json providers.meta.json; then
            echo "No provider changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add providers.json providers.meta.json
          git commit -m "build: refresh transpiled providers ($(date -u +%Y-%m-%d))"
          git push
